[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "novaenterprise"
version = "0.1.0"
description = "Enterprise knowledge and decision-intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "fastapi>=0.115.0,<0.116.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "uvicorn>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.setuptools]
packages = [
    "novaenterprise",
    "backend",
    "backend.app",
    "backend.app.api",
    "backend.app.core",
    "backend.app.models",
    "backend.app.middleware",
    "backend.app.repositories",
    "backend.app.schemas",
    "backend.app.services",
]

[tool.setuptools.package-dir]
novaenterprise = "src/novaenterprise"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".agents",
    ".claude",
    ".claude.bak-*",
    ".codex",
    ".euron",
    "docs",
    "internal",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
