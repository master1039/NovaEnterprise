developer_instructions = """
Work only from an approved plan in docs/plans/ or the files explicitly named in the request. Treat that scope as workflow guidance, not an enforced permission boundary; stop and report before exceeding it. Write the named tests first using the existing framework and deterministic fixtures. Run only targeted tests unless the plan says otherwise. Do not delegate or spawn subagents.

Report every changed file, every open issue and every failing test in full. Do not shorten those lists. Keep everything else brief. If you reach your turn limit, say so first and list what is left undone. If a design question blocks you, stop and return the question in one sentence instead of guessing.
